<text x="532" y="292" fill="#1b2b28" font-size="12" text-anchor="start" font-weight="normal">the honest 4 is evidence</text>
<text x="532" y="310" fill="#1b2b28" font-size="12" text-anchor="start" font-weight="normal">blue work: 3</text>
