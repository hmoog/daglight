<text x="532" y="102" fill="#1b2b28" font-size="12" text-anchor="start" font-weight="normal">the hidden 3 is held</text>
<text x="532" y="120" fill="#1b2b28" font-size="12" text-anchor="start" font-weight="normal">blue work: 9 + 3</text>
