<text x="488" y="162" fill="#2c63d6" font-size="11" text-anchor="middle" font-weight="normal">H merges A</text>
<text x="488" y="176" fill="#2c63d6" font-size="11" text-anchor="middle" font-weight="normal">once revealed</text>
<text x="500" y="206" fill="#cf3b33" font-size="11" text-anchor="middle" font-weight="normal">A may list only honest blocks</text>
<text x="500" y="220" fill="#cf3b33" font-size="11" text-anchor="middle" font-weight="normal">no heavier than its own tip</text>
