<text x="90" y="204" fill="#5a6d69" font-size="12" text-anchor="middle" font-weight="normal">the fork</text>
<text x="410" y="130" fill="#2c63d6" font-size="13" text-anchor="start" font-weight="bold">my side</text>
<text x="410" y="148" fill="#5a6d69" font-size="12" text-anchor="start" font-weight="normal">the chain above the fork, c</text>
<text x="410" y="164" fill="#5a6d69" font-size="12" text-anchor="start" font-weight="normal">with the rivals recorded above it, r</text>
