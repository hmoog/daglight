<text x="352" y="114" fill="#5a6d69" font-size="11" text-anchor="middle" font-weight="normal">settled</text>
<rect x="552" y="40" width="200" height="96" rx="10" fill="white" stroke="#2c63d6" stroke-width="1.5"/>
<text x="564" y="62" fill="#2c63d6" font-size="13" text-anchor="start" font-weight="bold">in every honest record</text>
<text x="564" y="84" fill="#1b2b28" font-size="12" text-anchor="start" font-weight="normal">the hidden blocks join</text>
<text x="564" y="102" fill="#1b2b28" font-size="12" text-anchor="start" font-weight="normal">below the threshold:</text>
<text x="564" y="120" fill="#1b2b28" font-size="12" text-anchor="start" font-weight="normal">red, and red is final</text>
<rect x="552" y="236" width="200" height="96" rx="10" fill="white" stroke="#cf3b33" stroke-width="1.5"/>
<text x="564" y="258" fill="#cf3b33" font-size="13" text-anchor="start" font-weight="bold">in the hidden record</text>
<text x="564" y="280" fill="#1b2b28" font-size="12" text-anchor="start" font-weight="normal">honest work is evidence</text>
<text x="564" y="298" fill="#1b2b28" font-size="12" text-anchor="start" font-weight="normal">while A trails, settled</text>
<text x="564" y="316" fill="#1b2b28" font-size="12" text-anchor="start" font-weight="normal">once built after the fold</text>
